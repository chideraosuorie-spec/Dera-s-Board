<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dera Board with Drag & Drop</title>
    <link rel="stylesheet" href="style/style.css">
</head>
<body>

    <header>
        <h1>Dera's Board</h1>
        <p>Drag and drop tasks between columns to update their status</p>
    </header>

    <div class="Dera-board">
        <!-- Column 1: To Do -->
        <div class="column" data-status="todo">
            <div class="column-header">
                <span class="column-title">📋 To Do</span>
                <span class="task-count" id="count-todo">0</span>
            </div>
            <div class="task-list" id="todo"></div>
            <form class="add-card-form" data-status="todo">
                <input type="text" class="add-card-input" placeholder="+ Add a task..." required autocomplete="off">
                <button type="submit" class="add-card-btn">Add Task</button>
            </form>
        </div>

        <!-- Column 2: In Progress -->
        <div class="column" data-status="in-progress">
            <div class="column-header">
                <span class="column-title">⚡ In Progress</span>
                <span class="task-count" id="count-in-progress">0</span>
            </div>
            <div class="task-list" id="in-progress"></div>
            <form class="add-card-form" data-status="in-progress">
                <input type="text" class="add-card-input" placeholder="+ Add a task..." required autocomplete="off">
                <button type="submit" class="add-card-btn">Add Task</button>
            </form>
        </div>

        <!-- Column 3: Completed -->
        <div class="column" data-status="completed">
            <div class="column-header">
                <span class="column-title">✅ Completed</span>
                <span class="task-count" id="count-completed">0</span>
            </div>
            <div class="task-list" id="completed"></div>
            <form class="add-card-form" data-status="completed">
                <input type="text" class="add-card-input" placeholder="+ Add a task..." required autocomplete="off">
                <button type="submit" class="add-card-btn">Add Task</button>
            </form>
        </div>
    </div>

    <script src="index.js"></script>
</body>
</html>
